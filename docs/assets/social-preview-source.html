<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1280, initial-scale=1">
  <title>山西财经大学期末资料索引</title>
  <style>
    :root {
      --paper: #eee1c7;
      --deep: #d8c19a;
      --ink: #28231d;
      --muted: #716556;
      --red: #a23b2d;
      --cream: #f8efdd;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 1280px;
      height: 640px;
      overflow: hidden;
    }

    body {
      font-family: "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
      color: var(--ink);
      background:
        repeating-linear-gradient(0deg, rgba(65, 50, 32, 0.035) 0, rgba(65, 50, 32, 0.035) 1px, transparent 1px, transparent 8px),
        var(--paper);
    }

    main {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 60px;
      align-items: center;
      width: 100%;
      height: 100%;
      padding: 68px 72px;
      border: 24px solid rgba(248, 239, 221, 0.58);
      box-shadow: inset 0 0 0 1px rgba(57, 44, 28, 0.36);
    }

    .kicker {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 32px;
      color: var(--red);
      font-family: Consolas, "Courier New", monospace;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.13em;
    }

    .kicker::after {
      content: "";
      width: 150px;
      height: 2px;
      background: var(--red);
    }

    h1 {
      margin: 0;
      font-family: "Microsoft YaHei", "Noto Serif CJK SC", serif;
      font-size: 63px;
      font-weight: 900;
      line-height: 1.18;
      letter-spacing: 0.02em;
    }

    .tagline {
      margin: 28px 0 0;
      color: var(--red);
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 0.15em;
    }

    .card {
      position: relative;
      min-height: 410px;
      padding: 31px 28px;
      border: 2px solid var(--ink);
      background: rgba(248, 239, 221, 0.72);
      box-shadow: 12px 12px 0 var(--deep);
    }

    .label {
      color: var(--muted);
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .count {
      margin: 5px 0 20px;
      color: var(--red);
      font-family: Georgia, serif;
      font-size: 83px;
      font-weight: 800;
      line-height: 1;
    }

    .count small {
      color: var(--ink);
      font-family: "Microsoft YaHei", sans-serif;
      font-size: 16px;
    }

    .list {
      display: grid;
      gap: 14px;
      padding: 23px 0;
      border-top: 1px solid rgba(40, 35, 29, 0.35);
      border-bottom: 1px solid rgba(40, 35, 29, 0.35);
      font-family: Consolas, "Courier New", monospace;
      font-size: 17px;
      font-weight: 700;
    }

    .item::before {
      content: "✓";
      margin-right: 10px;
      color: var(--red);
    }

    .stamp {
      width: 125px;
      margin: 23px 0 0 auto;
      padding: 10px 8px;
      transform: rotate(-4deg);
      border: 3px double var(--red);
      color: var(--red);
      text-align: center;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.12em;
    }

    .folio {
      position: absolute;
      left: 72px;
      bottom: 37px;
      color: var(--muted);
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <div class="kicker">UNOFFICIAL STUDENT ARCHIVE · PUBLIC INDEX</div>
      <h1>山西财经大学<br>期末资料索引</h1>
      <p class="tagline">可检索 · 有清单 · 可校验</p>
    </section>
    <aside class="card" aria-label="资料索引摘要">
      <div class="label">CATALOGUED FILES</div>
      <div class="count">121 <small>份资料</small></div>
      <div class="list">
        <div class="item">INDEX.md</div>
        <div class="item">MANIFEST.csv</div>
        <div class="item">SHA256</div>
      </div>
      <div class="stamp">21 科目<br>已编目</div>
    </aside>
    <div class="folio">FINAL EXAMS / STUDY MATERIALS / INTEGRITY HASHES</div>
  </main>
</body>
</html>
